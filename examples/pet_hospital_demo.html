<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 像素宠物医院 - 智能体演示系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-size: 4px;
            --bg-color: #e0f2f1;
            --floor-color: #ffffff;
            --wall-color: #b2dfdb;
        }

        body {
            font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
            background-color: #2c3e50;
            overflow: hidden;
            color: #333;
        }

        .pixel-border {
            border: 4px solid #000;
            image-rendering: pixelated;
        }

        #hospital-stage {
            width: 100%;
            height: 500px;
            background-color: #e0f7fa;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
            background-size: 30px 30px;
            position: relative;
            border: 8px solid #34495e;
            border-radius: 8px;
            overflow: hidden;
        }

        .wall-vertical {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 12px;
            background: #546e7a;
            z-index: 5;
            border-right: 2px solid #37474f;
        }

        .wall-horizontal {
            position: absolute;
            left: 40%;
            right: 0;
            height: 12px;
            background: #546e7a;
            z-index: 5;
            border-bottom: 2px solid #37474f;
        }

        .door {
            position: absolute;
            background: #81d4fa;
            opacity: 0.6;
            z-index: 4;
            border: 2px solid #0277bd;
        }

        .room-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 2px 8px;
            font-size: 12px;
            border-radius: 4px;
        }

        .character {
            position: absolute;
            transition: all 1s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60px;
            z-index: 10;
        }

        .sprite {
            font-size: 40px;
            filter: drop-shadow(2px 4px 2px rgba(0, 0, 0, 0.2));
            animation: bob 0.6s infinite alternate;
        }

        @keyframes bob {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        .char-name {
            background: white;
            padding: 0 4px;
            border: 2px solid #000;
            font-size: 12px;
            margin-top: 2px;
            white-space: nowrap;
        }

        .speech-bubble {
            position: absolute;
            bottom: 70px;
            background: white;
            border: 3px solid #000;
            padding: 8px;
            border-radius: 8px;
            max-width: 150px;
            font-size: 14px;
            z-index: 20;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.1);
            display: none;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -13px;
            left: 20px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #000 transparent transparent;
        }

        #log-container {
            height: 200px;
            overflow-y: auto;
            background: #1a1a1a;
            color: #00ff00;
            font-family: monospace;
            padding: 10px;
            font-size: 12px;
            border-radius: 4px;
        }

        #director-panel {
            background: #f1c40f;
            padding: 10px;
            border: 4px solid #d35400;
            border-radius: 8px;
        }

        #api-key {
            min-width: 280px;
        }
    </style>
</head>
<body class="p-4">
<div class="max-w-5xl mx-auto space-y-4">
    <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-xl border-b-4 border-gray-400 gap-4 flex-wrap">
        <div>
            <h1 class="text-3xl font-bold text-blue-600">🏥 像素 AI 宠物医院</h1>
            <p class="text-gray-500">演示：基于阿里云通义千问的智能体协同</p>
        </div>
        <div class="flex gap-2 flex-wrap items-center">
            <input id="api-key" type="password" placeholder="输入 DashScope API Key (sk-...)" class="border border-gray-400 rounded px-3 py-2" />
            <button id="save-key-btn" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-full font-bold shadow-lg transition">保存密钥</button>
            <button id="start-btn" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-full font-bold shadow-lg transition">开始就诊流程</button>
            <button id="reset-btn" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-full font-bold shadow-lg transition">重置</button>
        </div>
    </div>

    <div id="hospital-stage" class="relative">
        <div class="wall-vertical" style="left: 40%;"></div>
        <div class="wall-horizontal" style="top: 50%;"></div>

        <div class="door" style="top: 20%; left: 40%; width: 12px; height: 80px;"></div>
        <div class="door" style="top: 50%; left: 60%; width: 80px; height: 12px;"></div>

        <div class="room-label" style="top: 10px; left: 10px;">接待与候诊区</div>
        <div style="position: absolute; top: 60px; left: 20px; font-size: 30px;">🪑</div>
        <div style="position: absolute; top: 120px; left: 20px; font-size: 30px;">🪑</div>
        <div style="position: absolute; top: 180px; left: 20px; font-size: 30px;">🪑</div>
        <div style="position: absolute; top: 240px; left: 20px; font-size: 30px;">🪴</div>
        <div style="position: absolute; bottom: 80px; left: 25%; width: 60px; height: 120px; background: #8d6e63; border: 4px solid #5d4037; border-radius: 4px; display: flex; align-items: center; justify-content: center; z-index: 2;">
            <span style="font-size: 24px; transform: rotate(90deg);">💻</span>
        </div>

        <div class="room-label" style="top: 10px; left: 42%;">诊疗室</div>
        <div style="position: absolute; top: 80px; right: 15%; width: 100px; height: 60px; background: #cfd8dc; border: 4px solid #90a4ae; border-radius: 4px; display: flex; align-items: center; justify-content: center; z-index: 2;">
            <span style="font-size: 24px;">📝</span>
        </div>
        <div style="position: absolute; top: 100px; left: 45%; width: 120px; height: 60px; background: #b2dfdb; border: 4px solid #009688; border-radius: 8px; display: flex; align-items: center; justify-content: center; z-index: 2;">
            <span style="font-size: 24px;">🛏️</span>
        </div>

        <div class="room-label" style="bottom: 10px; right: 10px;">药房</div>
        <div style="position: absolute; top: 55%; right: 10%; width: 180px; height: 40px; background: #ffcc80; border: 4px solid #ef6c00; display: flex; justify-content: space-around; align-items: center;">
            <span>💊</span><span>🧴</span><span>💉</span><span>📦</span>
        </div>
        <div style="position: absolute; top: 65%; right: 10%; width: 180px; height: 40px; background: #ffcc80; border: 4px solid #ef6c00; display: flex; justify-content: space-around; align-items: center;">
            <span>🩹</span><span>🧪</span><span>🩸</span><span>📋</span>
        </div>
        <div style="position: absolute; bottom: 40px; left: 45%; width: 100px; height: 30px; background: #bcaaa4; border: 4px solid #795548; z-index: 2;"></div>

        <div id="char-nurse" class="character" style="top: 65%; left: 33%;">
            <div class="speech-bubble" id="bubble-nurse"></div>
            <div class="sprite">👩‍⚕️</div>
            <div class="char-name">护士-小美</div>
        </div>

        <div id="char-doctor" class="character" style="top: 10%; right: 15%;">
            <div class="speech-bubble" id="bubble-doctor"></div>
            <div class="sprite">👨‍⚕️</div>
            <div class="char-name">张医生</div>
        </div>

        <div id="char-owner" class="character" style="top: 20%; left: 10%;">
            <div class="speech-bubble" id="bubble-owner"></div>
            <div class="sprite">🧔</div>
            <div class="char-name">王先生</div>
        </div>

        <div id="char-pet" class="character" style="top: 25%; left: 18%;">
            <div class="speech-bubble" id="bubble-pet"></div>
            <div class="sprite">🐕</div>
            <div class="char-name">皮皮</div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div id="director-panel" class="col-span-1 shadow-lg">
            <h3 class="font-bold border-b-2 border-orange-700 mb-2 flex items-center">🎬 导演模型 (Director Model)</h3>
            <div class="space-y-2 text-sm">
                <div>当前阶段: <span id="current-phase" class="font-bold text-blue-800">等待启动</span></div>
                <div>正在行动: <span id="current-actor" class="font-bold text-red-800">无</span></div>
                <div class="mt-2 bg-white/50 p-2 rounded">
                    <strong>导演决策思考：</strong>
                    <div id="director-thought" class="italic text-gray-700">等待场景初始化...</div>
                </div>
            </div>
        </div>

        <div class="col-span-2 space-y-2">
            <div class="flex justify-between items-center text-white">
                <span class="text-sm font-bold">系统运行日志</span>
                <span class="text-xs opacity-50">LLM Engine: Qwen-Turbo</span>
            </div>
            <div id="log-container"></div>
        </div>
    </div>
</div>

<script>
    const modelName = "qwen-turbo";
    const STORAGE_KEY = "dashscope_api_key";
    const VALID_PHASES = new Set(["IDLE", "RECEPTION", "CLINIC", "PHARMACY", "DONE"]);
    const VALID_ACTORS = new Set(["nurse", "doctor", "owner", "pet"]);

    const LOCATIONS = {
        WAITING: { owner: { left: "10%", top: "20%" }, pet: { left: "18%", top: "25%" } },
        RECEPTION: { owner: { left: "18%", top: "65%" }, pet: { left: "26%", top: "70%" } },
        CLINIC: { owner: { left: "45%", top: "35%" }, pet: { left: "53%", top: "40%" } },
        PHARMACY: { owner: { left: "55%", top: "75%" }, pet: { left: "63%", top: "80%" } }
    };

    let state = {
        phase: "IDLE",
        history: [],
        isRunning: false,
        agents: {
            nurse: { name: "护士小美", role: "分诊与接待", personality: "热情周到" },
            doctor: { name: "张医生", role: "诊断与治疗", personality: "专业冷静" },
            owner: { name: "王先生", role: "宠物主人", personality: "焦急爱宠" },
            pet: { name: "皮皮", role: "生病的柯基", personality: "没精打采" }
        }
    };

    function getApiKey() {
        return localStorage.getItem(STORAGE_KEY) || "";
    }

    function setApiKey(key) {
        localStorage.setItem(STORAGE_KEY, key.trim());
    }

    const log = (msg, type = "info") => {
        const container = document.getElementById("log-container");
        const time = new Date().toLocaleTimeString();
        const line = document.createElement("div");
        let color = "#00ff00";
        if (type === "director") color = "#f1c40f";
        if (type === "error") color = "#ff4757";
        line.style.color = color;
        line.textContent = `[${time}] ${msg}`;
        container.appendChild(line);
        container.scrollTop = container.scrollHeight;
    };

    const moveChar = (charId, pos) => {
        const el = document.getElementById(`char-${charId}`);
        if (!el || !pos) return;
        if (pos.left) el.style.left = pos.left;
        if (pos.top) el.style.top = pos.top;
    };

    const showSpeech = (charId, text) => {
        const bubble = document.getElementById(`bubble-${charId}`);
        if (!bubble) return;
        bubble.innerText = text;
        bubble.style.display = "block";
        setTimeout(() => { bubble.style.display = "none"; }, 4000);
    };

    function extractFirstJson(rawText) {
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (!jsonMatch) {
            throw new Error(`找不到 JSON。原始回复: ${rawText}`);
        }
        return JSON.parse(jsonMatch[0]);
    }

    async function callLLM(prompt, systemInstruction = "") {
        const apiKey = getApiKey();
        if (!apiKey) {
            throw new Error("未配置 API Key，请先点击“保存密钥”。");
        }

        let retries = 0;
        const maxRetries = 3;

        while (retries < maxRetries) {
            try {
                const response = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: modelName,
                        temperature: 0.7,
                        messages: [
                            { role: "system", content: systemInstruction },
                            { role: "user", content: prompt }
                        ]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${data?.error?.message || response.statusText}`);
                }

                const content = data?.choices?.[0]?.message?.content;
                if (content) return content;

                throw new Error(`返回数据结构异常: ${JSON.stringify(data)}`);
            } catch (err) {
                log(`API调用警告(重试 ${retries + 1}/${maxRetries}): ${err.message}`, "error");
                if (retries >= maxRetries - 1) break;
                const delay = Math.pow(2, retries) * 1000;
                await new Promise((r) => setTimeout(r, delay));
                retries++;
            }
        }

        throw new Error("AI 响应失败，请检查密钥、网络或模型配置。");
    }

    async function directorStep() {
        const systemPrompt = `你是一个宠物医院模拟游戏的导演。你需要观察当前对话历史和阶段，决定下一步。
当前阶段: ${state.phase}
历史对话: ${JSON.stringify(state.history.slice(-5))}

输出必须是严格 JSON（不要 markdown）：
{
  "thought": "你的决策逻辑思考",
  "nextPhase": "RECEPTION/CLINIC/PHARMACY/DONE",
  "nextActor": "nurse/doctor/owner/pet",
  "action": "该角色的行动指令"
}`;

        const prompt = "决定下一步。如果刚开始，请先引导主人与宠物到前台。完成诊疗和取药后结束。";

        try {
            const resText = await callLLM(prompt, systemPrompt);
            const decision = extractFirstJson(resText);

            if (!VALID_PHASES.has(decision.nextPhase)) {
                throw new Error(`非法阶段: ${decision.nextPhase}`);
            }
            if (!VALID_ACTORS.has(decision.nextActor)) {
                throw new Error(`非法角色: ${decision.nextActor}`);
            }
            if (!decision.action || !decision.thought) {
                throw new Error("导演输出缺少 thought/action 字段");
            }

            document.getElementById("director-thought").innerText = decision.thought;
            document.getElementById("current-phase").innerText = decision.nextPhase;
            document.getElementById("current-actor").innerText = state.agents[decision.nextActor].name;

            state.phase = decision.nextPhase;
            return decision;
        } catch (e) {
            log(`导演决策出错: ${e.message}`, "error");
            return null;
        }
    }

    async function agentSpeak(actorKey, instruction) {
        const actor = state.agents[actorKey];
        if (!actor) return "……";

        const systemPrompt = `你正在扮演宠物医院角色：${actor.name}。
身份: ${actor.role}
性格: ${actor.personality}
当前阶段: ${state.phase}
请根据导演指令[${instruction}]生成一句简短对话（不超过30字），不要任何前缀。`;

        const prompt = `根据上下文说话。历史记录: ${JSON.stringify(state.history.slice(-3))}`;

        const text = await callLLM(prompt, systemPrompt);
        const cleanText = text.trim().replace(/^"|"$/g, "");
        state.history.push({ role: actorKey, content: cleanText });
        return cleanText;
    }

    function handleEnvironment(decision) {
        if (decision.nextPhase === "RECEPTION") {
            moveChar("owner", LOCATIONS.RECEPTION.owner);
            moveChar("pet", LOCATIONS.RECEPTION.pet);
        } else if (decision.nextPhase === "CLINIC") {
            moveChar("owner", LOCATIONS.CLINIC.owner);
            moveChar("pet", LOCATIONS.CLINIC.pet);
        } else if (decision.nextPhase === "PHARMACY") {
            moveChar("owner", LOCATIONS.PHARMACY.owner);
            moveChar("pet", LOCATIONS.PHARMACY.pet);
        } else if (decision.nextPhase === "DONE") {
            moveChar("owner", LOCATIONS.WAITING.owner);
            moveChar("pet", LOCATIONS.WAITING.pet);
        }
    }

    async function runSimulation() {
        if (!state.isRunning) return;

        log("导演正在观察并思考...", "director");
        const decision = await directorStep();
        if (!decision) {
            state.isRunning = false;
            document.getElementById("start-btn").innerText = "开始就诊流程";
            return;
        }

        handleEnvironment(decision);

        try {
            const speech = await agentSpeak(decision.nextActor, decision.action);
            showSpeech(decision.nextActor, speech);
            log(`${state.agents[decision.nextActor].name}: ${speech}`);
        } catch (e) {
            log(`角色生成失败: ${e.message}`, "error");
        }

        if (state.phase !== "DONE") {
            setTimeout(runSimulation, 4500);
        } else {
            log("医疗流程圆满结束！皮皮康复了。", "info");
            state.isRunning = false;
            document.getElementById("start-btn").innerText = "流程已结束";
        }
    }

    document.getElementById("save-key-btn").addEventListener("click", () => {
        const input = document.getElementById("api-key");
        const key = input.value.trim();
        if (!key.startsWith("sk-")) {
            log("API Key 格式不正确，需以 sk- 开头。", "error");
            return;
        }
        setApiKey(key);
        input.value = "";
        log("API Key 已保存到本地浏览器存储。", "info");
    });

    document.getElementById("start-btn").addEventListener("click", () => {
        if (state.isRunning) return;
        state.isRunning = true;
        state.phase = "IDLE";
        document.getElementById("start-btn").innerText = "运行中...";
        log("模拟启动！导演模型接入...");
        runSimulation();
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
        location.reload();
    });

    window.onload = () => {
        const existing = getApiKey();
        if (existing) {
            log("检测到已保存 API Key，可直接开始。", "info");
        } else {
            log("请先输入并保存 DashScope API Key。", "info");
        }
        log("系统初始化完成。等待用户指令。", "info");
    };
</script>
</body>
</html>
